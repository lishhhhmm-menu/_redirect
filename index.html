<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Redirecting...</title>
	</head>
	<body>
		<div id="content"></div>
		<script>
			const params = new URLSearchParams(window.location.search);
			const slug = (params.get("redirect") || "").trim();
			
			fetch('routes.json?t=' + Date.now(), { cache: 'no-store' })
				.then(response => {
					if (!response.ok) throw new Error('Network error');
					return response.json();
				})
				.then(routes => {
					const destination = routes[slug];
					
					if (destination) {
						window.location.replace(`https://${destination}.menu.web-presence.gr`);
					} else {
						document.getElementById("content").textContent = 'Invalid redirect for "' + slug + '"';
					}
				})
				.catch(() => {
					document.getElementById("content").textContent = 'Invalid redirect for "' + slug + '"';
				});
		</script>
	
	</body>
</html>
